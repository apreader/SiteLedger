[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "siteledger"
version = "0.4.0"
description = "Audit consistency across static-site HTML pages, JSON indexes, and navigation metadata."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Anthony Preader" },
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
siteledger = "siteledger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["siteledger"]
